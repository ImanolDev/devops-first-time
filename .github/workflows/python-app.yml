name: Python App CI

on:
  push:
    branches:
      - main
      - feature/github-actions

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify Python
      run: python --version

    - name: Run application syntax check
      run: python -m py_compile app.py
